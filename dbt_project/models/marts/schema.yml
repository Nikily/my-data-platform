version: 2

models:
  - name: mart_example
    description: "Daily order summary by status — exported to Power BI via Parquet."
    columns:
      - name: order_date
        description: "Truncated to day."
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
      - name: order_count
        tests:
          - not_null
