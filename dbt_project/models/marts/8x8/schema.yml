version: 2

models:
  - name: mart_8x8_call_summary
    description: >
      Daily call summary by PBX, direction, and disposition.
      Exported to Azure Blob Storage as Parquet for Power BI consumption.
    columns:
      - name: call_date
        description: "Date of the calls (UTC, truncated to day)."
        tests:
          - not_null
      - name: pbx_id
        description: "PBX identifier."
        tests:
          - not_null
      - name: direction
        description: "Call direction: Incoming or Outgoing."
      - name: last_leg_disposition
        description: "Final disposition of the call leg."
      - name: total_calls
        description: "Total number of calls."
      - name: missed_calls
        description: "Number of missed calls."
      - name: answered_calls
        description: "Number of answered calls."
      - name: avg_call_duration_seconds
        description: "Average call duration in seconds."
      - name: total_call_duration_seconds
        description: "Total call duration in seconds."
      - name: avg_ring_duration_seconds
        description: "Average ring duration in seconds."
