version: 2

sources:
  - name: raw_pbi_admin
    description: >
      Raw Power BI Admin REST API data loaded by dlt.
      Full tenant-wide snapshots replaced on every pipeline run.
      All tables live in the raw_pbi_admin schema in DuckDB.
    schema: raw_pbi_admin
    tables:
      - name: apps
        description: "All Power BI apps published in the tenant. Source: GET /admin/apps"
      - name: capacities
        description: "All Power BI Premium / Fabric capacities. Source: GET /admin/capacities"
      - name: refreshables
        description: "Datasets with a refresh history or active refresh schedule (last 7 days). Source: GET /admin/capacities/refreshables"
      - name: groups
        description: "All workspaces (groups) in the tenant. Source: GET /admin/groups"
      - name: dashboards
        description: "All dashboards across all workspaces. Source: GET /admin/dashboards"
      - name: reports
        description: "All reports across all workspaces. Source: GET /admin/reports"
      - name: datasets
        description: "All datasets (semantic models) across all workspaces. Source: GET /admin/datasets"
      - name: widely_shared_artifacts
        description: "Reports shared with the whole organisation via a link. Source: GET /admin/widelySharedArtifacts/linksSharedToWholeOrganization"
      - name: unused_artifacts
        description: "Datasets, reports, and dashboards not accessed in 30+ days, per workspace. Source: GET /admin/groups/{groupId}/unused"
      - name: scanner_workspaces
        description: "Workspace metadata from the Scanner API. Parent table; child tables hold nested artifact and user data. Source: Workspace Scanner API"
      - name: scanner_workspaces__users
        description: "Workspace-level user access entries. dlt child table of scanner_workspaces."
      - name: scanner_workspaces__reports
        description: "Reports nested inside scanner workspace results. dlt child table of scanner_workspaces."
      - name: scanner_workspaces__reports__users
        description: "Per-report user access entries. dlt child table of scanner_workspaces__reports."
      - name: scanner_workspaces__datasets
        description: "Datasets nested inside scanner workspace results. dlt child table of scanner_workspaces."
      - name: scanner_workspaces__datasets__users
        description: "Per-dataset user access entries. dlt child table of scanner_workspaces__datasets."
      - name: scanner_workspaces__dashboards
        description: "Dashboards nested inside scanner workspace results. dlt child table of scanner_workspaces."
      - name: scanner_workspaces__dashboards__users
        description: "Per-dashboard user access entries. dlt child table of scanner_workspaces__dashboards."
      - name: scanner_datasource_instances
        description: "Top-level datasource instances from the scanner result. Contains connection details (type, server, database, path, url) for every datasource referenced by any scanned dataset."
      - name: scanner_workspaces__datasets__datasource_usages
        description: "Links datasets to their datasource instances. dlt child table of scanner_workspaces__datasets."
      - name: scanner_workspaces__datasets__refresh_schedule__times
        description: "Refresh schedule time slots per dataset. dlt child table of scanner_workspaces__datasets. One row per scheduled time (e.g. '08:00', '20:00')."
      - name: dataset_refreshes
        description: "Last 5 refresh attempts per refreshable dataset. Append-only — one batch of rows added per hourly run. Source: GET /admin/datasets/{id}/refreshes"
