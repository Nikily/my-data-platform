name: my_data_platform
version: "1.0.0"
config-version: 2

profile: my_data_platform

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  my_data_platform:
    # Staging models read from raw dlt-loaded schemas.
    # Materialised as views — lightweight, no data duplication.
    staging:
      +materialized: view
      +schema: staging

    # Mart models are the analytics-ready output consumed by Power BI.
    # Materialised as tables — written to DuckDB and exported as Parquet.
    marts:
      +materialized: table
      +schema: marts
